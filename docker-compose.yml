name: payshield

services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - payshield-mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # A single-node replica set is required for multi-document transactions.
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./infra/mongo-init.sh:/scripts/mongo-init.sh:ro
    entrypoint: ["bash", "/scripts/mongo-init.sh"]
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - payshield-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  fraud-service:
    build:
      context: ./fraud-service
    environment:
      MODEL_PATH: /app/models
      FRAUD_THRESHOLD: "0.5"
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGODB_URI: mongodb://mongo:27017/payshield?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:-payshield-docker-development-secret-change-before-public-use}
      JWT_EXPIRES_IN: 1d
      REDIS_URL: redis://redis:6379
      FRAUD_SERVICE_URL: http://fraud-service:8000
      FRAUD_SERVICE_TIMEOUT_MS: "2500"
      FRONTEND_URL: http://localhost:8080,http://127.0.0.1:8080
      STARTING_BALANCE_PAISE: "5000000"
      DEMO_BALANCE_PAISE: "10000000"
      RISK_MEDIUM_THRESHOLD: "30"
      RISK_HIGH_THRESHOLD: "70"
      HIGH_RISK_ACTION: review
      ML_WEIGHT: "0.6"
      RULE_WEIGHT: "0.4"
      LARGE_AMOUNT_THRESHOLD_PAISE: "2500000"
      IDEMPOTENCY_TTL_SECONDS: "86400"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@payshield.dev}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-Customer@123}
    ports:
      - "5000:5000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      fraud-service:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  payshield-mongo:
  payshield-redis:
